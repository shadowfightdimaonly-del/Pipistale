workflows:
  default-workflow:
    name: Pipistale Android
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Apply sprite-sheet renderer patch
        script: python3 tooling/patch_sprite_renderer.py
      - name: Build Android APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
